# Upload Post Brand Configuration
# Each brand = an Upload Post "user profile"
#
# Setup per brand:
#   1. Create profile via API: POST /api/uploadposts/users { username: "brand-name" }
#   2. Generate connect URL: POST /api/uploadposts/users/generate-jwt { username: "brand-name" }
#   3. Visit URL to connect social accounts (Instagram, TikTok, etc.)
#   4. Mark connected: true below
#
# Auth: Authorization: Apikey $UPLOAD_POST_API_KEY
# Base URL: https://api.upload-post.com/api

brands:
  mr-growth-guide:
    name: "Mr Growth Guide"
    upload_post_user: "mrgg"               # Upload Post profile username
    voice: "Direct, actionable founder advice. Short punchy sentences."
    mc_brand_id: ""
    connected: true                        # Instagram (@cfw.social) connected
    content_routing:
      short: [instagram, tiktok, youtube]
      image: [instagram]
      carousel: [instagram]
    schedule:
      timezone: "America/New_York"
      instagram:
        posts_per_week: 5
        best_times: ["09:00", "12:00", "18:00"]
      tiktok:
        posts_per_week: 7
        best_times: ["07:00", "12:00", "19:00"]
      youtube:
        posts_per_week: 3
        best_times: ["10:00", "15:00"]

  b-vasanth:
    name: "B-Vasanth"
    upload_post_user: "b-vasanth"
    voice: "Thought leadership on AI, automation, and building systems."
    mc_brand_id: ""
    connected: false
    content_routing:
      short: [linkedin, x]
      image: [linkedin, x]
      carousel: [linkedin]
    schedule:
      timezone: "America/New_York"
      linkedin:
        posts_per_week: 3
        best_times: ["08:00", "12:00"]
      x:
        posts_per_week: 7
        best_times: ["09:00", "12:00", "17:00"]

  hustle-hub:
    name: "Hustle-Hub"
    upload_post_user: "hustle-hub"
    voice: "Motivational, hustle culture, side-income tips."
    mc_brand_id: ""
    connected: false
    content_routing:
      short: [instagram, tiktok]
      image: [instagram]
    schedule:
      timezone: "America/New_York"
      instagram:
        posts_per_week: 5
        best_times: ["07:00", "12:00", "20:00"]
      tiktok:
        posts_per_week: 7
        best_times: ["06:00", "12:00", "20:00"]

# Posting cadence best practices (reference):
#   Instagram Reels: 3-5/week, peak 9am/12pm/6pm
#   TikTok: 1-3/day, peak 7am/12pm/7pm
#   YouTube Shorts: 3-5/week, peak 10am/3pm
#   LinkedIn: 2-3/week, peak 8am/12pm Tue-Thu
#   X/Twitter: 1-3/day, peak 9am/12pm/5pm
#   Threads: 3-5/week
#   Pinterest: 3-5/week
