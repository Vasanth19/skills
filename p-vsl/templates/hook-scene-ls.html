<template id="hook-scene-ls">
<!--
  p-vsl hook scene — LANDSCAPE (1920x1080).
  Landscape variant of c-typing-ui/templates/hook-scene.html.
  All content lives above y=680 so the bottom-right talking-head PIP
  (x>=1512, y>=726) is never covered.
  data-composition-id="root" baked in; registers window.__timelines["root"].
  Placeholders: DURATION, EYEBROW, LINE1, LINE2, LINE3, SUBHEAD, ACCENT (hex no #).
-->
<div
  data-composition-id="root"
  data-start="0"
  data-duration="{{DURATION}}"
  data-width="1920"
  data-height="1080"
>
  <style>
    [data-composition-id="root"] {
      --bg-navy:    #0F172A;
      --accent:     #{{ACCENT}};
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;

      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-navy);
      font-family: 'Oswald', sans-serif;
    }

    [data-composition-id="root"] .hs-glow {
      position: absolute;
      left: 50%; top: 40%;
      width: 1600px; height: 1600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle,
        color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 58%);
      pointer-events: none;
      will-change: transform, opacity;
    }

    [data-composition-id="root"] .hs-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(148,163,184,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.04) 1px, transparent 1px);
      background-size: 120px 120px;
    }

    [data-composition-id="root"] .hs-eyebrow {
      position: absolute;
      top: 150px;
      width: 100%;
      text-align: center;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 34px; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      will-change: transform, opacity;
    }

    [data-composition-id="root"] .hs-title-stack {
      position: absolute;
      top: 280px;
      width: 100%;
      text-align: center;
      padding: 0 160px;
      box-sizing: border-box;
      will-change: transform;
    }
    [data-composition-id="root"] .hs-line {
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 130px;
      line-height: 0.95;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      will-change: transform, opacity;
      display: block;
    }
    [data-composition-id="root"] .hs-line-white  { color: var(--text-white); }
    [data-composition-id="root"] .hs-line-accent {
      color: var(--accent);
      text-shadow: 0 0 32px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    [data-composition-id="root"] .hs-subhead {
      position: absolute;
      top: 600px;
      width: 100%;
      text-align: center;
      padding: 0 360px;   /* narrow so centered text clears the bottom-right PIP */
      box-sizing: border-box;
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      font-size: 52px; font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.15;
      will-change: transform, opacity;
    }
  </style>

  <div class="hs-grid"></div>
  <div class="hs-glow" id="hs-glow"></div>

  <div class="hs-eyebrow" id="hs-eyebrow">{{EYEBROW}}</div>

  <div class="hs-title-stack" id="hs-title-stack">
    <span class="hs-line hs-line-white" id="hs-line1">{{LINE1}}</span>
    <div style="height:10px"></div>
    <span class="hs-line hs-line-accent" id="hs-line2">{{LINE2}}</span>
    <div style="height:6px"></div>
    <span class="hs-line hs-line-accent" id="hs-line3">{{LINE3}}</span>
  </div>

  <div class="hs-subhead" id="hs-subhead">{{SUBHEAD}}</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    var DURATION = parseFloat("{{DURATION}}");
    var LINE2    = "{{LINE2}}".trim();
    var LINE3    = "{{LINE3}}".trim();
    var SUBHEAD  = "{{SUBHEAD}}".trim();

    if (!LINE2) document.getElementById("hs-line2").style.display = "none";
    if (!LINE3) document.getElementById("hs-line3").style.display = "none";
    if (!SUBHEAD) document.getElementById("hs-subhead").style.display = "none";

    var tl = gsap.timeline({ paused: true });

    tl.fromTo("#hs-glow", { scale: 0.92, opacity: 0.6 },
      { scale: 1.08, opacity: 1, duration: DURATION, ease: "sine.inOut" }, 0);

    var pulseCycles = Math.max(1, Math.ceil(DURATION));
    tl.fromTo("#hs-title-stack", { scale: 0.98 },
      { scale: 1.02, duration: DURATION / pulseCycles, ease: "sine.inOut",
        repeat: pulseCycles - 1, yoyo: true }, 0);

    tl.fromTo("#hs-eyebrow", { y: 22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);
    tl.fromTo("#hs-line1", { y: 22, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.2);
    if (LINE2) {
      tl.fromTo("#hs-line2", { y: 22, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.37);
    }
    if (LINE3) {
      tl.fromTo("#hs-line3", { y: 22, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.52);
    }
    if (SUBHEAD) {
      tl.fromTo("#hs-subhead", { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.65);
    }

    window.__timelines["root"] = tl;
  </script>
</div>
</template>
