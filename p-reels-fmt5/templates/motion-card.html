<!DOCTYPE html>
<!--
  p-reels-fmt5 — parameterized HyperFrames MOTION CARD template.

  This file is FILLED, not authored. A recipe execution sub-process (kimi)
  substitutes the {{PLACEHOLDERS}} for ONE beat, then runs `hyperframes render`.
  No HTML authoring happens at runtime — the creative is baked in here.

  Placeholders (all required; the planner/recipe provides each per beat):
    {{DURATION}}   — beat length in seconds (number, e.g. 3.5)
    {{EYEBROW}}    — small mono label, UPPERCASE (e.g. "MR GROWTH GUIDE")
    {{GHOST}}      — one huge faint background word (e.g. "LEVERAGE")
    {{TITLE_HTML}} — the headline; wrap the key word in
                     <span class="accent">WORD</span> for the orange highlight
                     (e.g.  IT'S ABOUT WHAT <span class="accent">KEEPS WORKING</span>)

  Brand: MGG dark-slate (#0F172A) + orange (#F97316). Override the two CSS vars
  --bg / --accent for a different brand; everything else derives from them.
-->
<div
  data-composition-id="motion-card"
  data-start="0"
  data-duration="{{DURATION}}"
  data-width="1080"
  data-height="1920"
>
  <style>
    /* Fonts: the HyperFrames compiler embeds supported Google Fonts from the
       font-family value directly — NO @import / @font-face needed. Barlow
       Condensed + JetBrains Mono are both supported. */
    [data-composition-id="motion-card"] {
      --bg: #0F172A;        /* deep slate */
      --accent: #F97316;    /* orange */
      --fg: #F1F5F9;        /* near-white */
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Oswald', sans-serif;
    }

    /* ── Background depth (always-moving decoratives) ── */
    [data-composition-id="motion-card"] .glow {
      position: absolute;
      left: 50%; top: 46%;
      width: 1300px; height: 1300px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(249,115,22,0.16) 0%, rgba(249,115,22,0.04) 38%, rgba(15,23,42,0) 66%);
      will-change: transform, opacity;
    }
    [data-composition-id="motion-card"] .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
      background-size: 120px 120px;
      opacity: 0.6;
    }
    [data-composition-id="motion-card"] .ghost {
      position: absolute;
      left: 50%; top: 40%;
      transform: translate(-50%, -50%);
      width: 1400px;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 460px;
      line-height: 0.8;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: rgba(241,245,249,0.04);
      white-space: nowrap;
      will-change: transform;
    }

    /* ── Foreground content ── */
    [data-composition-id="motion-card"] .content {
      position: absolute;
      left: 0; right: 0;
      /* Top half ONLY — the PIP lives in the bottom ~40%, so text/graphics never
         sit behind it. (Owner: "the PIP blocks all the important stuff.") */
      top: 7%;
      padding: 0 72px;
      max-height: 52%;
    }
    [data-composition-id="motion-card"] .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      will-change: transform, opacity;
    }
    [data-composition-id="motion-card"] .eyebrow::before {
      content: "";
      display: inline-block;
      width: 46px; height: 3px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 18px;
      transform: translateY(-4px);
    }
    [data-composition-id="motion-card"] .title {
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 112px;
      line-height: 0.92;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--fg);
    }
    [data-composition-id="motion-card"] .title .word {
      display: inline-block;
      will-change: transform, opacity;
    }
    [data-composition-id="motion-card"] .title .accent { color: var(--accent); }
  </style>

  <div class="grid"></div>
  <div class="glow" id="glow"></div>
  <div class="ghost" id="ghost">{{GHOST}}</div>

  <div class="content">
    <div class="eyebrow" id="eyebrow">{{EYEBROW}}</div>
    <div class="title" id="title">{{TITLE_HTML}}</div>
  </div>

  <!-- GSAP must be loaded explicitly — the framework does NOT auto-inject it. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    // Wrap title words in .word spans for a staggered entrance. DOM-based (never
    // string-splits HTML) so the recipe's <span class="accent"> stays intact —
    // it animates as ONE word unit. (The old innerHTML split broke the tag.)
    (function () {
      var title = document.getElementById("title");
      var out = [];
      Array.prototype.forEach.call(title.childNodes, function (node) {
        if (node.nodeType === 3) { // text node → split into words
          node.textContent.split(/(\s+)/).forEach(function (tok) {
            if (tok === "") return;
            if (/^\s+$/.test(tok)) { out.push(document.createTextNode(tok)); return; }
            var s = document.createElement("span");
            s.className = "word";
            s.textContent = tok;
            out.push(s);
          });
        } else if (node.nodeType === 1) { // element (the accent span) → one word unit
          node.classList.add("word");
          out.push(node);
        }
      });
      title.innerHTML = "";
      out.forEach(function (n) { title.appendChild(n); });
    })();

    const tl = gsap.timeline({ paused: true });

    // Ambient: glow breathes, ghost drifts — nothing is ever static.
    var DUR = parseFloat("{{DURATION}}");
    tl.fromTo("#glow", { scale: 0.95, opacity: 0.7 }, { scale: 1.12, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
    tl.fromTo("#ghost", { xPercent: -52, opacity: 0 }, { xPercent: -48, opacity: 1, duration: DUR, ease: "none" }, 0);

    // Eyebrow slides up + fades in.
    tl.fromTo("#eyebrow", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);

    // Title words stagger up.
    tl.fromTo("#title .word", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power4.out", stagger: 0.07 }, 0.25);

    window.__timelines["motion-card"] = tl;
  </script>
</div>
